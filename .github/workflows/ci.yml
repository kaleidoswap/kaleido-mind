name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck (packages, apps, examples)
        run: pnpm -r typecheck

      - name: Test (core)
        run: pnpm --filter @kaleidorg/mind test

      - name: Product evaluation and dataset export (offline)
        run: |
          pnpm dataset:eval --mock
          pnpm dataset:export .dataset/evaluation

      # Cross-package discovery only: no node, model or funded wallet.
      - name: MCP contract (published server)
        run: |
          npm install --prefix /tmp/mind-mcp-contract --no-audit --no-fund kaleido-mcp@0.4.5 @tetherto/wdk-wallet-spark@1.0.0-beta.28 @kaleidorg/wdk-wallet-liquid@1.0.0-beta.9
          KALEIDO_MCP_CONTRACT_PATH=/tmp/mind-mcp-contract/node_modules/kaleido-mcp/dist/index.js pnpm --filter @kaleidorg/mind exec vitest run src/tools/mcp.contract.test.ts

      # The examples without a model or node: scripted provider + fake tools.
      - name: Examples (offline)
        run: |
          pnpm --filter @kaleidorg/example-node-minimal run start:mock
          pnpm --filter @kaleidorg/example-rgb-agent run start:offline

      # What `npm create @kaleidorg/mind` produces, installed with npm against
      # this commit's @kaleidorg/mind, outside the workspace.
      - name: Starter (create-mind)
        run: |
          mkdir -p /tmp/starter
          (cd packages/core && pnpm pack --pack-destination /tmp/starter)
          node packages/create-mind/bin/create-mind.js /tmp/starter/app
          cd /tmp/starter/app
          npm pkg set "dependencies.@kaleidorg/mind=file:$(ls /tmp/starter/kaleidorg-mind-*.tgz)"
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run start:offline

      # Offline eval gate — no model, no QVAC worker. Exercises the full
      # dataset -> run -> grade -> aggregate pipeline for Tracks B and C via the
      # mock provider. Non-blocking: the @qvac/sdk dependency in apps/* may not
      # install cleanly on Linux CI, and this is a smoke check, not a gate.
      - name: Eval smoke (mock, offline)
        continue-on-error: true
        run: |
          cd apps/cli
          npx tsx src/index.ts multistep --mock --repeats 1
          npx tsx src/index.ts safety --mock --repeats 1
